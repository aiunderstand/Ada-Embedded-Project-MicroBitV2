name: Publish toolchain image

'on':
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - '.github/workflows/devcontainer-image.yml'
  workflow_dispatch:

# Deliberately no schedule. This file is copied verbatim into every student
# repository by "Use this template"; a cron here would have each of them
# rebuilding and pushing a ~2 GB image to their own GHCR.
permissions:
  contents: read
  packages: write

env:
  # The tag names the toolchain it contains, so it can never drift out of step
  # with the pin the way a date-derived tag would.
  IMAGE: ghcr.io/${{ github.repository_owner }}/ada-microbit-toolchain
  TAG: gnat-15.1.2

jobs:
  build:
    if: github.repository == 'aiunderstand/Ada-Embedded-Project-MicroBitV2'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both architectures. Building arm64 under QEMU
          # would emulate the extraction of a 2 GB toolchain, which takes hours.
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # The manifest step re-attaches the sha256: prefix, so store the bare digest.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    if: github.repository == 'aiunderstand/Ada-Embedded-Project-MicroBitV2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            $(for d in *; do echo -n "${IMAGE}@sha256:${d} "; done)
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      # A package pushed by GITHUB_TOKEN from a public repository is linked to
      # that repository and inherits its visibility, so this is normally already
      # public and needs no manual step. Verified rather than assumed:
      - name: Check the image is anonymously pullable
        run: |
          set -euo pipefail
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/ada-microbit-toolchain:pull&service=ghcr.io" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
                 -H 'Accept: application/vnd.oci.image.index.v1+json' \
                 "https://ghcr.io/v2/${{ github.repository_owner }}/ada-microbit-toolchain/manifests/${TAG}")
          if [ "$code" = "200" ]; then
            echo "::notice::Image is public and anonymously pullable."
          else
            echo "::error::Image is NOT anonymously pullable (HTTP $code). Make the package public at" \
                 "https://github.com/users/${{ github.repository_owner }}/packages/container/ada-microbit-toolchain/settings" \
                 "or student Codespaces cannot pull it."
            exit 1
          fi
